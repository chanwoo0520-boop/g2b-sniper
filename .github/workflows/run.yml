name: G2B 봇 V3

on:
  workflow_dispatch:
  schedule:
  
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: |
          python -m pip install --upgrade pip
          pip install requests
      - run: python main.py
