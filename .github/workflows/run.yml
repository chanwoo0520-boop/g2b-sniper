name: G2B Bot V3

on:
  schedule:
    - cron: '0 0,3,6,8 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - uses: actions/setup-python@v4
      with:
        python-version: '3.9'
    - run: |
        python -m pip install --upgrade pip
        pip install requests
    - run: python main.py
